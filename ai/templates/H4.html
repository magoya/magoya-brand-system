<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Magoya · módulo H4 — Tira de 3 fotos + título</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#EEF2EC;padding:2vw;font-family:'Manrope',Arial,sans-serif}
  .slide{position:relative;aspect-ratio:16/9;width:100%;max-width:1920px;margin:0 auto;
         container-type:inline-size;overflow:hidden;font-family:'Manrope',Arial,sans-serif;
         box-shadow:0 10px 40px rgba(0,0,0,.12)}
  .t{position:absolute;white-space:pre-line;font-family:inherit}
  .r,.im,.chart{position:absolute}
  .tb{position:absolute;border-collapse:collapse;font-size:1.4cqw}
  .tb td{border-bottom:1px solid #DCD0C4;padding:.6cqw .9cqw}
</style>
<!--
PLANTILLA OFICIAL MAGOYA — módulo H4 (Tira de 3 fotos + título)
Cuándo usarlo: mostrar rango geográfico o de cultivos sin caer en un collage. Tres aéreas, mismo alto, un rótulo por foto. Sin texto encima de las imágenes.

ATENCION — TODO EL TEXTO Y LAS CIFRAS DE ESTA PLANTILLA SON EJEMPLO.
Nunca entregar los textos/cifras de ejemplo como contenido real. Los datos
aprobados de la compania viven en https://brand.magoya.com/ai/facts.json —
si el dato que necesitas no esta ahi, pedilo al usuario; no lo inventes.

REGLAS PARA LA IA (no negociables):
1. NO tocar posiciones, tamaños, colores ni tipografías. La geometría ES la marca.
2. Solo reemplazar el TEXTO INTERNO de los elementos con data-slot, respetando
   max_caracteres_aprox y max_lineas de ai/templates/index.json. Si tu texto no
   entra, acortá el texto — nunca achiques la fuente ni muevas la caja.
3b. Los elementos data-accent="lima" son el golpe de lima de la slide. Podés MOVER
   el acento a otro elemento del mismo grupo (sacale el atributo a uno y ponéselo a
   otro, junto con el color #A2FF00) cuando el destacado semántico sea otro — por
   ejemplo si estás proponiendo el modelo de la card 1 y no el de la card 2. Regla:
   como máximo UNO por slide, y cero es válido. Lo que no se cambia es la geometría.
4. Los elementos data-locked="brand" (wordmark, logos, íconos, motivos) no se
   tocan, no se reemplazan, no se mueven.
5. Las imágenes data-reemplazable aceptan otra foto REAL respetando su regla.
5. El texto "NN" del número de página se reemplaza por el número real (2 dígitos).
-->
</head><body>
<div class="slide" data-modulo="H4">
<div class="r" style="left:0cqw;top:0cqw;width:100cqw;height:56.25cqw;background:#FFFFFF"></div>
<img class="im" src="https://brand.magoya.com/assets/magoya-wordmark-black.svg" data-locked="brand" style="left:7.5cqw;top:3.2cqw;width:11cqw;height:3.007cqw;object-fit:fill" alt="">
<p class="t" data-slot="t1" data-rol="numero_de_pagina" style="left:76.5cqw;top:3.5cqw;width:16cqw;height:2.2cqw;font-size:0.767cqw;font-weight:800;color:#AAAAAA;text-align:right;line-height:1.2;letter-spacing:0.0994em">NN</p>
<p class="t" data-slot="t2" data-rol="display" style="left:7.5cqw;top:11.5cqw;width:58cqw;height:11cqw;font-size:2.8cqw;font-weight:800;color:#161616;text-align:left;line-height:1.08;letter-spacing:-0.03em">Ten countries, one product language</p>
<img class="im" src="https://brand.magoya.com/assets/photos/field-rows.jpg"  data-slot="img2" data-reemplazable="foto: respetar B&N+acento si es persona" style="left:7.5cqw;top:23cqw;width:27.3cqw;height:20cqw;object-fit:cover" alt="">
<p class="t" data-slot="t3" data-rol="caption" style="left:7.5cqw;top:44cqw;width:27.3cqw;height:4cqw;font-size:0.967cqw;font-weight:400;color:#666666;text-align:left;line-height:1.3">Row crops · Argentina &amp; Brazil</p>
<img class="im" src="https://brand.magoya.com/assets/photos/field-terraces.jpg"  data-slot="img3" data-reemplazable="foto: respetar B&N+acento si es persona" style="left:36.2cqw;top:23cqw;width:27.3cqw;height:20cqw;object-fit:cover" alt="">
<p class="t" data-slot="t4" data-rol="caption" style="left:36.2cqw;top:44cqw;width:27.3cqw;height:4cqw;font-size:0.967cqw;font-weight:400;color:#666666;text-align:left;line-height:1.3">Terraced systems · Southeast Asia</p>
<img class="im" src="https://brand.magoya.com/assets/photos/field-corn.jpg"  data-slot="img4" data-reemplazable="foto: respetar B&N+acento si es persona" style="left:64.9cqw;top:23cqw;width:27.3cqw;height:20cqw;object-fit:cover" alt="">
<p class="t" data-slot="t5" data-rol="caption" style="left:64.9cqw;top:44cqw;width:27.3cqw;height:4cqw;font-size:0.967cqw;font-weight:400;color:#666666;text-align:left;line-height:1.3">Corn belt · United States</p>
</div>
</body></html>
