<!--
PLANTILLA OFICIAL MAGOYA — módulo H3 (Foto de fondo completo + scrim verde + statement)
Cuándo usarlo: statement de impacto a mitad de deck. El scrim verde profundo 55→86% es obligatorio cuando hay texto encima; es el único degradado permitido.

ATENCION — TODO EL TEXTO Y LAS CIFRAS DE ESTA PLANTILLA SON EJEMPLO.
Nunca entregar los textos/cifras de ejemplo como contenido real. Los datos
aprobados de la compania viven en https://brand.magoya.com/ai/facts.json —
si el dato que necesitas no esta ahi, pedilo al usuario; no lo inventes.

REGLAS PARA LA IA (no negociables):
1. NO tocar posiciones, tamaños, colores ni tipografías. La geometría ES la marca.
2. Solo reemplazar el TEXTO INTERNO de los elementos con data-slot, respetando
   max_caracteres_aprox y max_lineas de ai/templates/index.json. Si tu texto no
   entra, acortá el texto — nunca achiques la fuente ni muevas la caja.
3b. Los elementos data-accent="lima" son el golpe de lima de la slide. Podés MOVER
   el acento a otro elemento del mismo grupo (sacale el atributo a uno y ponéselo a
   otro, junto con el color #A2FF00) cuando el destacado semántico sea otro — por
   ejemplo si estás proponiendo el modelo de la card 1 y no el de la card 2. Regla:
   como máximo UNO por slide, y cero es válido. Lo que no se cambia es la geometría.
4. Los elementos data-locked="brand" (wordmark, logos, íconos, motivos) no se
   tocan, no se reemplazan, no se mueven.
5. Las imágenes data-reemplazable aceptan otra foto REAL respetando su regla.
5. El texto "NN" del número de página se reemplaza por el número real (2 dígitos).
-->
</head><body>
<div class="slide" data-modulo="H3">
<div class="r" style="left:0cqw;top:0cqw;width:100cqw;height:56.25cqw;background:#0C2117"></div>
<img class="im" src="https://brand.magoya.com/assets/photos/field-bali.jpg"  data-slot="img0" data-reemplazable="foto: respetar B&N+acento si es persona" style="left:0cqw;top:0cqw;width:100cqw;height:56.25cqw;object-fit:cover" alt="">
<div class="r" style="left:0cqw;top:0cqw;width:100cqw;height:56.25cqw;background:#0C2117;opacity:0.72"></div>
<img class="im" src="https://brand.magoya.com/assets/magoya-wordmark-cream.svg" data-locked="brand" style="left:7.5cqw;top:3.2cqw;width:11cqw;height:3.007cqw;object-fit:fill" alt="">
<p class="t" data-slot="t1" data-rol="numero_de_pagina" style="left:76.5cqw;top:3.5cqw;width:16cqw;height:2.2cqw;font-size:0.767cqw;font-weight:800;color:#C4B5A6;text-align:right;line-height:1.2;letter-spacing:0.0994em">NN</p>
<p class="t" data-slot="t2" data-rol="display" style="left:7.5cqw;top:29cqw;width:62cqw;height:14cqw;font-size:3.733cqw;font-weight:800;color:#F6F1EB;text-align:left;line-height:1.05;letter-spacing:-0.03em">The planting window doesn’t move. Your release date does.</p>
<p class="t" data-slot="t3" data-rol="subtitulo" style="left:7.5cqw;top:43.5cqw;width:46cqw;height:7cqw;font-size:1.167cqw;font-weight:400;color:#ECE3DB;text-align:left;line-height:1.45">We plan against the crop calendar. If a feature misses the window, it waits a year — so we ship what the season can use, then keep building.</p>
</div>
