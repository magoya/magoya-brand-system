<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Magoya · módulo A5 — Título + ícono semántico grande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#EEF2EC;padding:2vw;font-family:'Manrope',Arial,sans-serif}
  .slide{position:relative;aspect-ratio:16/9;width:100%;max-width:1920px;margin:0 auto;
         container-type:inline-size;overflow:hidden;font-family:'Manrope',Arial,sans-serif;
         box-shadow:0 10px 40px rgba(0,0,0,.12)}
  .t{position:absolute;white-space:pre-line;font-family:inherit}
  .r,.im,.chart{position:absolute}
  .tb{position:absolute;border-collapse:collapse;font-size:1.4cqw}
  .tb td{border-bottom:1px solid #DCD0C4;padding:.6cqw .9cqw}
</style>
<!--
PLANTILLA OFICIAL MAGOYA — módulo A5 (Título + ícono semántico grande)
Cuándo usarlo: abrir un capítulo temático. El ícono representa el concepto del título (satélite = teledetección), no decora. Uno solo, del set agro, en negro sobre claro.

ATENCION — TODO EL TEXTO Y LAS CIFRAS DE ESTA PLANTILLA SON EJEMPLO.
Nunca entregar los textos/cifras de ejemplo como contenido real. Los datos
aprobados de la compania viven en https://brand.magoya.com/ai/facts.json —
si el dato que necesitas no esta ahi, pedilo al usuario; no lo inventes.

REGLAS PARA LA IA (no negociables):
1. NO tocar posiciones, tamaños, colores ni tipografías. La geometría ES la marca.
2. Solo reemplazar el TEXTO INTERNO de los elementos con data-slot, respetando
   max_caracteres_aprox y max_lineas de ai/templates/index.json. Si tu texto no
   entra, acortá el texto — nunca achiques la fuente ni muevas la caja.
3. Los elementos data-locked="brand" (wordmark, logos, íconos, motivos) no se
   tocan, no se reemplazan, no se mueven.
4. Las imágenes data-reemplazable aceptan otra foto REAL respetando su regla.
5. El texto "NN" del número de página se reemplaza por el número real (2 dígitos).
-->
</head><body>
<div class="slide" data-modulo="A5">
<div class="r" style="left:0cqw;top:0cqw;width:100cqw;height:56.25cqw;background:#EEF2EC"></div>
<img class="im" src="https://brand.magoya.com/assets/magoya-wordmark-black.svg" data-locked="brand" style="left:7.5cqw;top:3.2cqw;width:11cqw;height:3.007cqw;object-fit:fill" alt="">
<p class="t" data-slot="t1" data-rol="numero_de_pagina" style="left:76.5cqw;top:3.5cqw;width:16cqw;height:2.2cqw;font-size:0.767cqw;font-weight:800;color:#AAAAAA;text-align:right;line-height:1.2;letter-spacing:0.0994em">NN</p>
<p class="t" data-slot="t2" data-rol="kicker" style="left:7.5cqw;top:13cqw;width:50cqw;height:2.6cqw;font-size:1.0cqw;font-weight:800;color:#009145;text-align:left;line-height:1.2;letter-spacing:0.1247em">REMOTE SENSING</p>
<p class="t" data-slot="t3" data-rol="display" style="left:7.5cqw;top:17.5cqw;width:50cqw;height:18cqw;font-size:3.2cqw;font-weight:800;color:#161616;text-align:left;line-height:1.08;letter-spacing:-0.03em">Satellite data that reaches the agronomist, not the archive.</p>
<div class="r" style="left:7.5cqw;top:37.5cqw;width:14cqw;height:0.8cqw;background:#A2FF00;border-radius:0.4cqw"></div>
<div class="im" data-asset="assets/studio/icons/agro/satelite.svg" data-locked="brand" style="left:63.5cqw;top:15cqw;width:26cqw;height:26cqw;background:#161616;-webkit-mask-image:url(https://brand.magoya.com/assets/studio/icons/agro/satelite.svg);mask-image:url(https://brand.magoya.com/assets/studio/icons/agro/satelite.svg);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:fill;mask-size:fill;-webkit-mask-position:center;mask-position:center"></div>
</div>
</body></html>
